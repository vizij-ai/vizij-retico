# Build and deploy both profiles to Cloud Run on merge to main.
#
# Authenticates with Workload Identity Federation rather than a service account key:
# GitHub mints a short-lived OIDC token, GCP exchanges it for credentials, and nothing
# long-lived is stored in this repo's secrets. The pool's attribute condition pins the
# exchange to this repository, so a fork cannot obtain the deployer identity.
#
# The GCP side is already provisioned (pool, provider, github-deployer service account
# and its bindings). See docs/13.
name: deploy

on:
  push:
    branches: [main]
  # Deploying an unchanged commit is harmless and useful when a deploy half-failed.
  workflow_dispatch:

# Superseding an in-flight deploy is right for a demo service: the newest commit on main
# is what should be live. Do not cancel in progress — a half-applied Cloud Run deploy is
# worse than a slightly stale one, so let the running job finish first.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  PROJECT: vizij-retico
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for WIF
    strategy:
      # Both profiles are independent services. A `full` failure must not stop `lite`
      # from shipping — lite is the link people are given.
      fail-fast: false
      matrix:
        profile: [lite, full]

    name: deploy (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4

      # `full` is ~4 GB compressed and roughly 10-12 GB unpacked, against a stock runner's
      # ~14 GB of free space. Reclaiming the preinstalled toolchains we never use buys
      # ~25 GB, which is the difference between this building and dying on ENOSPC
      # two-thirds of the way through a 20 minute build.
      - name: Reclaim disk
        if: matrix.profile == 'full'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h / | tail -1

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/86159759255/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@vizij-retico.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Build here rather than on Cloud Build. GitHub's runners are already linux/amd64 —
      # the architecture Cloud Run requires and the reason cloudbuild.yaml exists at all
      # (see docs/13.2) — so there is nothing to gain from shipping the source elsewhere
      # to compile it. It also avoids the GCS source-staging bucket entirely: under
      # Workload Identity, `gcloud builds submit` fails with "forbidden from accessing the
      # bucket [PROJECT_cloudbuild] ... serviceusage.services.use" even though the deployer
      # holds serviceUsageConsumer and the identical call succeeds under direct
      # impersonation. Not uploading a source tarball sidesteps the whole interaction.
      #
      # cloudbuild.yaml remains for building by hand on a bigger machine.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/vizij/vizij-retico"
          docker build \
            --build-arg PROFILE="${PROFILE}" \
            --tag "${IMAGE}:${PROFILE}" \
            --tag "${IMAGE}:${PROFILE}-${GITHUB_SHA}" \
            .
          docker push "${IMAGE}:${PROFILE}"
          docker push "${IMAGE}:${PROFILE}-${GITHUB_SHA}"

      - name: Deploy
        env:
          PROFILE: ${{ matrix.profile }}
        run: PROJECT="$PROJECT" REGION="$REGION" PROFILE="$PROFILE" ./scripts/deploy.sh

      # A deploy that returns a URL but serves errors is still a failed deploy.
      - name: Smoke test
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          # deploy.sh names lite "vizij-retico" and everything else "vizij-retico-<profile>".
          if [ "$PROFILE" = "lite" ]; then SERVICE=vizij-retico; else SERVICE="vizij-retico-$PROFILE"; fi
          URL=$(gcloud run services describe "$SERVICE" \
                  --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          echo "deployed: $URL"
          # `full` cold-starts behind multi-GB of model weights, so allow longer than the
          # default before calling it a failed deploy.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 \
                   --retry 8 --retry-delay 10 --retry-all-errors "$URL/health")
          echo "GET /health -> $code"
          test "$code" = "200"
          echo "- ${PROFILE}: $URL" >> "$GITHUB_STEP_SUMMARY"
